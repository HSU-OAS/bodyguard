# FR-U-04/NFR-08: LOCAL TLS package candidate; no public deployment or URL/body logging.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 64k;

    server {
        listen 8443 ssl;
        server_name bodyguard.test;
        ssl_certificate /etc/bodyguard/tls/cert.pem;
        ssl_certificate_key /etc/bodyguard/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /srv/bodyguard;
        if ($host != bodyguard.test) { return 421; }

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

        # API shares only this container's network namespace, bound to loopback.
        # Overwrite client-supplied forwarding headers; never append/trust outside proxies.
        location ~ ^/api(?:/|$) {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_intercept_errors off;
            error_page 502 504 =503 /__api_unavailable;
        }
        location = /__api_unavailable {
            internal;
            default_type application/json;
            return 503 '{"detail":"서비스 연결을 다시 시도해 주세요."}';
        }

        # Real files only; missing/dev assets must not become SPA HTML.
        location ^~ /assets/ { try_files $uri =404; }
        location = /brand/google-icon.png { try_files $uri =404; }
        location = /index.html { try_files $uri =404; }
        location = / { try_files /index.html =404; }
        location ~ ^/(?:start|explore|login|signup|help|data|posture-records|password/(?:forgot|reset)|account(?:/(?:delete|notifications))?|records(?:/[^/]+)?)$ {
            try_files /index.html =404;
        }
        location / { return 404; }
    }
}
