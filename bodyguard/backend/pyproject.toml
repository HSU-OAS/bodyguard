[project]
name = "bodyguard-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic-settings>=2.15,<2.16",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "psycopg[binary]>=3.3,<3.4",
  "pwdlib[argon2]>=0.3,<0.4",
  "aiosmtplib>=5.1,<5.2",
  "email-validator>=2.3,<2.4",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<9.2",
  "httpx>=0.28,<1",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
