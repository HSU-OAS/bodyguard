name: Publish webcam inspection preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bodyguard-pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch reviewed avatar source commit
        run: git fetch --depth=1 origin 2be0ebebe731d4b2e44cd93f453ddbf76b6b581f
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and prepare SDK assets
        working-directory: bodyguard/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm assets
      - name: Build isolated preview
        run: node bodyguard/pages-preview/build.mjs "${RUNNER_TEMP}/bodyguard-pages-preview"
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/bodyguard-pages-preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
